<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#8a5e38"/>
      <stop offset="100%" stop-color="#c79968"/>
    </linearGradient>
    <linearGradient id="page" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fbf6ec"/>
      <stop offset="100%" stop-color="#e3d3b8"/>
    </linearGradient>
    <linearGradient id="page-shadow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#000000" stop-opacity="0.0"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0.18"/>
    </linearGradient>
    <filter id="soft-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="6"/>
      <feOffset dx="0" dy="4" result="offsetblur"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.3"/></feComponentTransfer>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Tam kaplama arka plan (köşeler maskelenecek) -->
  <rect width="512" height="512" fill="url(#bg)"/>

  <!-- İçerik safe-zone içinde (merkez %80, padding her yönden ~52px) -->
  <g transform="translate(64, 64) scale(0.75)">
    <g filter="url(#soft-shadow)">
      <path d="M88 168 C88 152, 100 140, 116 140 L256 132 L256 408 L116 396 C100 394, 88 382, 88 366 Z"
            fill="url(#page)" stroke="#5a3a22" stroke-width="4"/>
      <path d="M424 168 C424 152, 412 140, 396 140 L256 132 L256 408 L396 396 C412 394, 424 382, 424 366 Z"
            fill="url(#page)" stroke="#5a3a22" stroke-width="4"/>
      <path d="M256 132 L256 408" stroke="#5a3a22" stroke-width="3" opacity="0.6"/>
      <rect x="252" y="132" width="8" height="276" fill="url(#page-shadow)" opacity="0.4"/>
    </g>

    <g stroke="#7a5230" stroke-width="7" stroke-linecap="round" opacity="0.55">
      <line x1="124" y1="200" x2="232" y2="196"/>
      <line x1="124" y1="232" x2="232" y2="228"/>
      <line x1="124" y1="264" x2="216" y2="260"/>
      <line x1="124" y1="296" x2="232" y2="292"/>
      <line x1="124" y1="328" x2="200" y2="324"/>
    </g>
    <g stroke="#7a5230" stroke-width="7" stroke-linecap="round" opacity="0.55">
      <line x1="280" y1="196" x2="388" y2="200"/>
      <line x1="280" y1="228" x2="388" y2="232"/>
      <line x1="280" y1="260" x2="372" y2="264"/>
      <line x1="280" y1="292" x2="388" y2="296"/>
      <line x1="280" y1="324" x2="356" y2="328"/>
    </g>

    <path d="M340 132 L340 250 L360 230 L380 250 L380 132 Z"
          fill="#d4a574" stroke="#5a3a22" stroke-width="3" stroke-linejoin="round"/>
  </g>
</svg>
