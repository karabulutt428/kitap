<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<title>İkon Üretici</title>
<style>
  body {
    font-family: system-ui, sans-serif;
    background: #1a140f;
    color: #ece4d6;
    margin: 0;
    padding: 32px;
    text-align: center;
  }
  h1 { font-weight: 600; margin-bottom: 8px; }
  p { color: #a89c8a; margin: 4px 0 24px; }
  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
    gap: 16px;
    max-width: 1100px;
    margin: 0 auto 32px;
  }
  .card {
    background: #221c15;
    border: 1px solid #2e2620;
    border-radius: 14px;
    padding: 18px;
  }
  .card h3 { margin: 0 0 4px; font-size: 16px; }
  .card .meta { color: #a89c8a; font-size: 12px; margin-bottom: 12px; }
  .card canvas {
    background: #0a0a0a;
    border-radius: 8px;
    max-width: 100%;
    height: auto;
    display: block;
    margin: 0 auto 12px;
  }
  button {
    background: #d4a574;
    color: #1a140f;
    border: 0;
    padding: 10px 18px;
    font-size: 14px;
    font-weight: 600;
    border-radius: 8px;
    cursor: pointer;
    transition: transform .15s ease, opacity .15s ease;
    margin: 4px;
  }
  button:hover { transform: translateY(-1px); }
  button:active { transform: scale(0.97); }
  button.secondary {
    background: #2e2620;
    color: #ece4d6;
  }
  .toolbar {
    margin: 24px 0 32px;
  }
  .status {
    color: #a89c8a;
    font-size: 13px;
    margin-top: 8px;
    min-height: 20px;
  }
  .ok { color: #7fc88e; }
</style>
</head>
<body>

<h1>📚 Kütüphane İkonları</h1>
<p>SVG'den yüksek kaliteli PNG'ler üretir. Tek tıkla hepsini indir, sonra <code>icons/</code> klasörüne kopyala.</p>

<div class="toolbar">
  <button id="download-all">📥 Tümünü İndir (5 PNG)</button>
  <button class="secondary" id="reload">🔄 Yeniden Yükle</button>
</div>
<div class="status" id="status"></div>

<div class="grid" id="grid"></div>

<script>
const SOURCES = [
  // [svg, output filename, size]
  { svg: "../icons/icon.svg",          name: "favicon-32.png",        size: 32,  display: 64  },
  { svg: "../icons/icon.svg",          name: "icon-192.png",          size: 192, display: 160 },
  { svg: "../icons/icon.svg",          name: "icon-512.png",          size: 512, display: 220 },
  { svg: "../icons/icon.svg",          name: "apple-touch-icon.png",  size: 180, display: 160 },
  { svg: "../icons/icon-maskable.svg", name: "icon-maskable-512.png", size: 512, display: 220, maskable: true },
];

const grid = document.getElementById("grid");
const status = document.getElementById("status");

function setStatus(msg, ok) {
  status.textContent = msg;
  status.className = "status " + (ok ? "ok" : "");
}

async function loadSvgAsImage(url) {
  const res = await fetch(url);
  if (!res.ok) throw new Error(`SVG yüklenemedi: ${url}`);
  const text = await res.text();
  const blob = new Blob([text], { type: "image/svg+xml" });
  const blobUrl = URL.createObjectURL(blob);
  return new Promise((resolve, reject) => {
    const img = new Image();
    img.onload = () => { URL.revokeObjectURL(blobUrl); resolve(img); };
    img.onerror = (e) => { URL.revokeObjectURL(blobUrl); reject(e); };
    img.src = blobUrl;
  });
}

async function renderIcon({ svg, name, size, display, maskable }) {
  const card = document.createElement("div");
  card.className = "card";
  card.innerHTML = `
    <h3>${name}</h3>
    <div class="meta">${size} × ${size} PNG${maskable ? " · maskable" : ""}</div>
    <canvas width="${display}" height="${display}"></canvas>
    <button data-name="${name}">⬇ Bu PNG'yi indir</button>
  `;
  grid.appendChild(card);

  const canvas = card.querySelector("canvas");
  const ctx = canvas.getContext("2d");

  try {
    const img = await loadSvgAsImage(svg);
    // Önizleme için küçük canvas'a çiz
    const previewSize = display;
    canvas.width = previewSize;
    canvas.height = previewSize;
    ctx.drawImage(img, 0, 0, previewSize, previewSize);

    // İndirme için yüksek çözünürlüklü canvas oluştur
    const fullCanvas = document.createElement("canvas");
    fullCanvas.width = size;
    fullCanvas.height = size;
    const fullCtx = fullCanvas.getContext("2d");
    fullCtx.imageSmoothingEnabled = true;
    fullCtx.imageSmoothingQuality = "high";
    fullCtx.drawImage(img, 0, 0, size, size);

    const btn = card.querySelector("button");
    btn.addEventListener("click", () => {
      fullCanvas.toBlob((blob) => {
        const url = URL.createObjectURL(blob);
        const a = document.createElement("a");
        a.href = url;
        a.download = name;
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        URL.revokeObjectURL(url);
      }, "image/png");
    });

    return { name, fullCanvas };
  } catch (err) {
    card.innerHTML += `<div style="color:#e88;">Hata: ${err.message}</div>`;
    return null;
  }
}

async function init() {
  grid.innerHTML = "";
  setStatus("İkonlar oluşturuluyor…");
  const results = await Promise.all(SOURCES.map(renderIcon));
  const ok = results.filter(Boolean);
  setStatus(`✓ ${ok.length} ikon hazır. Tek tıkla indirebilirsin.`, true);
  return ok;
}

let allIcons = [];
init().then(list => allIcons = list);

document.getElementById("download-all").addEventListener("click", async () => {
  if (allIcons.length === 0) { setStatus("Önce ikonlar yüklenmeli."); return; }
  setStatus("İndiriliyor…");
  for (const { name, fullCanvas } of allIcons) {
    await new Promise((resolve) => {
      fullCanvas.toBlob((blob) => {
        const url = URL.createObjectURL(blob);
        const a = document.createElement("a");
        a.href = url;
        a.download = name;
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        URL.revokeObjectURL(url);
        setTimeout(resolve, 200); // tarayıcılar arası indirme aralığı
      }, "image/png");
    });
  }
  setStatus(`✓ Tümü indirildi (${allIcons.length} dosya). icons/ klasörüne kopyala.`, true);
});

document.getElementById("reload").addEventListener("click", () => {
  init().then(list => allIcons = list);
});
</script>
</body>
</html>
