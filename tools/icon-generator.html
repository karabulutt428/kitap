<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<title>İkon Üretici</title>
<style>
  body {
    font-family: system-ui, sans-serif;
    background: #1a140f;
    color: #ece4d6;
    margin: 0;
    padding: 32px;
    text-align: center;
  }
  h1 { font-weight: 600; margin-bottom: 8px; }
  p { color: #a89c8a; margin: 4px 0 24px; }
  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
    gap: 16px;
    max-width: 1100px;
    margin: 0 auto 32px;
  }
  .card {
    background: #221c15;
    border: 1px solid #2e2620;
    border-radius: 14px;
    padding: 18px;
  }
  .card h3 { margin: 0 0 4px; font-size: 16px; }
  .card .meta { color: #a89c8a; font-size: 12px; margin-bottom: 12px; }
  .card canvas {
    background: #0a0a0a;
    border-radius: 8px;
    max-width: 100%;
    height: auto;
    display: block;
    margin: 0 auto 12px;
  }
  button {
    background: #d4a574;
    color: #1a140f;
    border: 0;
    padding: 10px 18px;
    font-size: 14px;
    font-weight: 600;
    border-radius: 8px;
    cursor: pointer;
    transition: transform .15s ease, opacity .15s ease;
    margin: 4px;
  }
  button:hover { transform: translateY(-1px); }
  button:active { transform: scale(0.97); }
  button.secondary {
    background: #2e2620;
    color: #ece4d6;
  }
  .toolbar { margin: 24px 0 32px; }
  .status {
    color: #a89c8a;
    font-size: 13px;
    margin-top: 8px;
    min-height: 20px;
  }
  .ok { color: #7fc88e; }
</style>
</head>
<body>

<h1>📚 Kütüphane İkonları</h1>
<p>SVG'den yüksek kaliteli PNG'ler üretir. Tek tıkla hepsini indir, sonra <code>icons/</code> klasörüne kopyala.</p>

<div class="toolbar">
  <button id="download-all">📥 Tümünü İndir (5 PNG)</button>
</div>
<div class="status" id="status"></div>

<div class="grid" id="grid"></div>

<script>
// SVG içerikleri doğrudan gömülü (file:// CORS sorunu yok)
const SVG_REGULAR = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#8a5e38"/>
      <stop offset="100%" stop-color="#c79968"/>
    </linearGradient>
    <linearGradient id="bg-shine" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.18"/>
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="page" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fbf6ec"/>
      <stop offset="100%" stop-color="#e3d3b8"/>
    </linearGradient>
    <linearGradient id="page-shadow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#000000" stop-opacity="0.0"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0.18"/>
    </linearGradient>
    <filter id="soft-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="8"/>
      <feOffset dx="0" dy="6" result="offsetblur"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.35"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="512" height="512" rx="112" ry="112" fill="url(#bg)"/>
  <rect width="512" height="512" rx="112" ry="112" fill="url(#bg-shine)"/>
  <g filter="url(#soft-shadow)">
    <path d="M88 168 C88 152, 100 140, 116 140 L256 132 L256 408 L116 396 C100 394, 88 382, 88 366 Z"
          fill="url(#page)" stroke="#5a3a22" stroke-width="4"/>
    <path d="M424 168 C424 152, 412 140, 396 140 L256 132 L256 408 L396 396 C412 394, 424 382, 424 366 Z"
          fill="url(#page)" stroke="#5a3a22" stroke-width="4"/>
    <path d="M256 132 L256 408" stroke="#5a3a22" stroke-width="3" opacity="0.6"/>
    <rect x="252" y="132" width="8" height="276" fill="url(#page-shadow)" opacity="0.4"/>
  </g>
  <g stroke="#7a5230" stroke-width="7" stroke-linecap="round" opacity="0.55">
    <line x1="124" y1="200" x2="232" y2="196"/>
    <line x1="124" y1="232" x2="232" y2="228"/>
    <line x1="124" y1="264" x2="216" y2="260"/>
    <line x1="124" y1="296" x2="232" y2="292"/>
    <line x1="124" y1="328" x2="200" y2="324"/>
  </g>
  <g stroke="#7a5230" stroke-width="7" stroke-linecap="round" opacity="0.55">
    <line x1="280" y1="196" x2="388" y2="200"/>
    <line x1="280" y1="228" x2="388" y2="232"/>
    <line x1="280" y1="260" x2="372" y2="264"/>
    <line x1="280" y1="292" x2="388" y2="296"/>
    <line x1="280" y1="324" x2="356" y2="328"/>
  </g>
  <path d="M340 132 L340 250 L360 230 L380 250 L380 132 Z"
        fill="#d4a574" stroke="#5a3a22" stroke-width="3" stroke-linejoin="round"/>
</svg>`;

const SVG_MASKABLE = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#8a5e38"/>
      <stop offset="100%" stop-color="#c79968"/>
    </linearGradient>
    <linearGradient id="page" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fbf6ec"/>
      <stop offset="100%" stop-color="#e3d3b8"/>
    </linearGradient>
    <linearGradient id="page-shadow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#000000" stop-opacity="0.0"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0.18"/>
    </linearGradient>
    <filter id="soft-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="6"/>
      <feOffset dx="0" dy="4" result="offsetblur"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.3"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="512" height="512" fill="url(#bg)"/>
  <g transform="translate(64, 64) scale(0.75)">
    <g filter="url(#soft-shadow)">
      <path d="M88 168 C88 152, 100 140, 116 140 L256 132 L256 408 L116 396 C100 394, 88 382, 88 366 Z"
            fill="url(#page)" stroke="#5a3a22" stroke-width="4"/>
      <path d="M424 168 C424 152, 412 140, 396 140 L256 132 L256 408 L396 396 C412 394, 424 382, 424 366 Z"
            fill="url(#page)" stroke="#5a3a22" stroke-width="4"/>
      <path d="M256 132 L256 408" stroke="#5a3a22" stroke-width="3" opacity="0.6"/>
      <rect x="252" y="132" width="8" height="276" fill="url(#page-shadow)" opacity="0.4"/>
    </g>
    <g stroke="#7a5230" stroke-width="7" stroke-linecap="round" opacity="0.55">
      <line x1="124" y1="200" x2="232" y2="196"/>
      <line x1="124" y1="232" x2="232" y2="228"/>
      <line x1="124" y1="264" x2="216" y2="260"/>
      <line x1="124" y1="296" x2="232" y2="292"/>
      <line x1="124" y1="328" x2="200" y2="324"/>
    </g>
    <g stroke="#7a5230" stroke-width="7" stroke-linecap="round" opacity="0.55">
      <line x1="280" y1="196" x2="388" y2="200"/>
      <line x1="280" y1="228" x2="388" y2="232"/>
      <line x1="280" y1="260" x2="372" y2="264"/>
      <line x1="280" y1="292" x2="388" y2="296"/>
      <line x1="280" y1="324" x2="356" y2="328"/>
    </g>
    <path d="M340 132 L340 250 L360 230 L380 250 L380 132 Z"
          fill="#d4a574" stroke="#5a3a22" stroke-width="3" stroke-linejoin="round"/>
  </g>
</svg>`;

const SOURCES = [
  { svg: SVG_REGULAR,  name: "favicon-32.png",        size: 32,  display: 64  },
  { svg: SVG_REGULAR,  name: "icon-192.png",          size: 192, display: 160 },
  { svg: SVG_REGULAR,  name: "icon-512.png",          size: 512, display: 220 },
  { svg: SVG_REGULAR,  name: "apple-touch-icon.png",  size: 180, display: 160 },
  { svg: SVG_MASKABLE, name: "icon-maskable-512.png", size: 512, display: 220, maskable: true },
];

const grid = document.getElementById("grid");
const status = document.getElementById("status");

function setStatus(msg, ok) {
  status.textContent = msg;
  status.className = "status " + (ok ? "ok" : "");
}

function svgToImage(svgText) {
  // Data URL üzerinden yükle - file:// için en güvenli
  const encoded = "data:image/svg+xml;charset=utf-8," + encodeURIComponent(svgText);
  return new Promise((resolve, reject) => {
    const img = new Image();
    img.onload = () => resolve(img);
    img.onerror = (e) => reject(new Error("SVG yüklenemedi"));
    img.src = encoded;
  });
}

async function renderIcon({ svg, name, size, display, maskable }) {
  const card = document.createElement("div");
  card.className = "card";
  card.innerHTML = `
    <h3>${name}</h3>
    <div class="meta">${size} × ${size} PNG${maskable ? " · maskable" : ""}</div>
    <canvas width="${display}" height="${display}"></canvas>
    <button data-name="${name}">⬇ Bu PNG'yi indir</button>
  `;
  grid.appendChild(card);

  const canvas = card.querySelector("canvas");
  const ctx = canvas.getContext("2d");

  try {
    const img = await svgToImage(svg);
    canvas.width = display;
    canvas.height = display;
    ctx.drawImage(img, 0, 0, display, display);

    const fullCanvas = document.createElement("canvas");
    fullCanvas.width = size;
    fullCanvas.height = size;
    const fullCtx = fullCanvas.getContext("2d");
    fullCtx.imageSmoothingEnabled = true;
    fullCtx.imageSmoothingQuality = "high";
    fullCtx.drawImage(img, 0, 0, size, size);

    const btn = card.querySelector("button");
    btn.addEventListener("click", () => {
      fullCanvas.toBlob((blob) => {
        const url = URL.createObjectURL(blob);
        const a = document.createElement("a");
        a.href = url;
        a.download = name;
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        URL.revokeObjectURL(url);
      }, "image/png");
    });

    return { name, fullCanvas };
  } catch (err) {
    card.innerHTML += `<div style="color:#e88;">Hata: ${err.message}</div>`;
    return null;
  }
}

async function init() {
  grid.innerHTML = "";
  setStatus("İkonlar oluşturuluyor…");
  const results = await Promise.all(SOURCES.map(renderIcon));
  const ok = results.filter(Boolean);
  setStatus(`✓ ${ok.length} ikon hazır. Tek tıkla indirebilirsin.`, true);
  return ok;
}

let allIcons = [];
init().then(list => allIcons = list);

document.getElementById("download-all").addEventListener("click", async () => {
  if (allIcons.length === 0) { setStatus("Önce ikonlar yüklenmeli."); return; }
  setStatus("İndiriliyor…");
  for (const { name, fullCanvas } of allIcons) {
    await new Promise((resolve) => {
      fullCanvas.toBlob((blob) => {
        const url = URL.createObjectURL(blob);
        const a = document.createElement("a");
        a.href = url;
        a.download = name;
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        URL.revokeObjectURL(url);
        setTimeout(resolve, 250);
      }, "image/png");
    });
  }
  setStatus(`✓ Tümü indirildi (${allIcons.length} dosya). icons/ klasörüne kopyala.`, true);
});
</script>
</body>
</html>
